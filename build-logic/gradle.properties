# `build-logic` is a separate composite/included build (see settings.gradle.kts's
# includeBuild("build-logic")) — Gradle does NOT propagate the root project's gradle.properties
# into included builds (https://github.com/gradle/gradle/issues/2534), so these must be
# duplicated here for them to actually take effect on convention/*.kt's own compilation. See the
# root gradle.properties and docs/DECISIONS.md for why.
android.newDsl=false
android.builtInKotlin=false
