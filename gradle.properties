# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin
kotlin.code.style=official

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false

# Suppress unsupported compileSdk warnings from AGP when preview/newer SDKs are used.
android.suppressUnsupportedCompileSdk=37

# AGP 9's default "new DSL" (CommonExtension without generics; defaultConfig{}/compileOptions{}/
# lint{}/buildFeatures{} block-lambda functions moved off CommonExtension onto the concrete
# ApplicationExtension/LibraryExtension types; minSdk/targetSdk gained a version-spec block form)
# isn't what build-logic/convention was written against. Temporary, officially-documented opt-out
# — removed in AGP 10.0 — until convention/*.kt is migrated. See docs/DECISIONS.md.
android.newDsl=false
# Keep classic Kotlin Gradle Plugin behavior: build-logic/convention already applies
# org.jetbrains.kotlin.android explicitly (see docs/DECISIONS.md) rather than relying on AGP 9's
# built-in Kotlin, which co-existing with an explicit kotlin-android application can conflict.
android.builtInKotlin=false
