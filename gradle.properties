# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin
kotlin.code.style=official

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false

# Suppress unsupported compileSdk warnings from AGP when preview/newer SDKs are used.
android.suppressUnsupportedCompileSdk=37

# Keep classic Kotlin Gradle Plugin behavior: build-logic/convention already applies
# org.jetbrains.kotlin.android explicitly (see docs/DECISIONS.md) rather than relying on AGP 9's
# built-in Kotlin, which co-existing with an explicit kotlin-android application can conflict.
#
# IMPORTANT: `build-logic` is a separate composite/included build (settings.gradle.kts's
# includeBuild("build-logic")) and does NOT inherit this file — build-logic/gradle.properties
# duplicates this property for its own compilation. Keep both files in sync.
android.builtInKotlin=false
